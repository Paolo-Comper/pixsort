[package]
name = "pixsort"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Local, fast photo archive organizer and deduplicator"
license = "MIT"

[dependencies]
eframe = { version = "0.37", features = ["glow"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
rusqlite = { version = "0.43", features = ["bundled"] }
fast_image_resize = "6"
kamadak-exif = "0.6"
sha2 = "0.11"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
walkdir = "2"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
libloading = "0.9"

[dev-dependencies]
tempfile = "3"
